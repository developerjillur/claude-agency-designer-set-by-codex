name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the skills
        run: ./install.sh
      - name: codex-imagegen tests
        run: python3 -m unittest discover -s ~/.claude/skills/codex-imagegen/tests
      - name: codex-design tests
        run: python3 -m unittest discover -s ~/.claude/skills/codex-design/tests
      - name: Pattern library renders clean
        run: CODEX_DESIGN_PATTERNS=1 python3 -m unittest discover -s ~/.claude/skills/codex-design/tests -p "test_patterns.py"
