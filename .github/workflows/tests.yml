name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (for agy-watch-video)
        run: brew install ffmpeg
      - name: Install the skills
        run: ./install.sh
      - name: codex-imagegen tests
        run: python3 -m unittest discover -s ~/.claude/skills/codex-imagegen/tests
      - name: codex-design tests
        run: python3 -m unittest discover -s ~/.claude/skills/codex-design/tests
      - name: agy-watch-video tests
        run: python3 -m unittest discover -s ~/.claude/skills/agy-watch-video/tests
      - name: remotion-broll tests
        run: python3 -m unittest discover -s ~/.claude/skills/remotion-broll/tests
      - name: nexa-video-creator tests
        run: python3 -m unittest discover -s ~/.claude/skills/nexa-video-creator/tests
      - name: nexa-sound tests
        run: python3 -m unittest discover -s ~/.claude/skills/nexa-sound/tests
      - name: nexa-speech tests
        run: python3 -m unittest discover -s ~/.claude/skills/nexa-speech/tests
      - name: nexa-research tests
        run: python3 -m unittest discover -s ~/.claude/skills/nexa-research/tests
      - name: nexa-script tests
        run: python3 -m unittest discover -s ~/.claude/skills/nexa-script/tests
      - name: nexa-copy tests
        run: python3 -m unittest discover -s ~/.claude/skills/nexa-copy/tests
      - name: Pattern library renders clean
        run: CODEX_DESIGN_PATTERNS=1 python3 -m unittest discover -s ~/.claude/skills/codex-design/tests -p "test_patterns.py"
