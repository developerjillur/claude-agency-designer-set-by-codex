<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type-led post</title>
<!-- Pattern: type-led post (direction "Swiss Signal"). Variants by class on <body>: v-announce (default),
     v-event (info block of date · time · place · price), v-hiring (role + chips incl. pay range).
     Presets: ig-portrait, ig-3x4, ig-square, li-square, fb-feed. Headline 110-150 px, flush left, on a visible grid;
     one signal colour ≤ 10 % of the area; no image needed. -->
<link rel="stylesheet" href="https://codex-design.invalid/kit/cd-kit.css">
<link rel="stylesheet" href="https://codex-design.invalid/sample-brand/brand.css">
<script src="https://codex-design.invalid/kit/cd-kit.js"></script>
<style>
  body { background: var(--paper); color: var(--ink); }
  /* the label sits with its headline, not alone at the top */
  .safe { display: grid; grid-template-rows: 1fr auto; }
  .lead { align-self: center; }
  .kicker { display: flex; align-items: center; gap: 22px; margin-bottom: 30px;
    font: 700 max(50px, var(--label-min, 0px))/1 var(--font-text); color: var(--primary); }
  .kicker::before { content: ""; width: 90px; height: 20px; background: var(--accent);
    -webkit-mask: var(--motif-mask, none) center / 100% 100% no-repeat; mask: var(--motif-mask, none) center / 100% 100% no-repeat; }
  h1 { margin: 0; width: 88%; display: flex; align-items: center;
    font: 800 150px/0.94 var(--font-display); letter-spacing: -0.025em; text-wrap: balance; }
  .foot { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 40px;
    border-top: 3px solid var(--ink); padding-top: 32px; }
  .support { margin: 0; font: 500 40px/1.3 var(--font-text); max-width: 24ch; text-wrap: pretty; }
  .wordmark { width: max(240px, var(--wordmark-min, 0px)); height: auto; }
  .info { display: none; margin: 0; font: 700 40px/1.35 var(--font-text); }
  .info span { color: var(--muted); font-weight: 500; }
  .chips { display: none; flex-wrap: wrap; gap: 14px; margin-top: 28px; }
  .chips b { font: 700 max(34px, var(--label-min, 0px))/1 var(--font-text); padding: 16px 22px; border: 3px solid var(--ink); border-radius: 999px; }
  .v-event .support { display: none; } .v-event .info { display: block; }
  .v-hiring .chips { display: flex; }
</style>
</head>
<body class="v-announce">
  <div class="safe">
    <div class="lead">
      <div class="kicker">Now open</div>
      <h1 class="balance" data-fit="90,150" data-fit-lines="3">A roastery you can walk into on Harbour Street</h1>
    </div>
    <div class="foot">
      <div>
        <p class="support">Tastings every Saturday morning. Beans roasted on site, sold by weight.</p>
        <p class="info">Sat 10 Oct · 09:00–13:00<br><span>12 Harbour Street · Free entry</span></p>
        <div class="chips"><b>On site</b><b>Full time</b><b>€34–38k</b></div>
      </div>
      <img class="wordmark" src="https://codex-design.invalid/sample-brand/wordmark.svg" alt="Tidewater">
    </div>
  </div>
</body>
</html>
