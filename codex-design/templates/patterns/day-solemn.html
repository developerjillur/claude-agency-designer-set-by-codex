<title>Day post (solemn)</title>
<!-- Pattern: solemn or memorial day (occasions.md §1.2-1.3). Sample: Remembrance Sunday, 8 November 2026 (UK; the
     second Sunday of November), with the customary line from the Exhortation. Presets: ig-portrait, ig-square,
     fb-feed, ig-story. Render with --occasion solemn: the checks block greetings (Happy, Mubarak, শুভ), exclamation
     marks, emoji and anything that sells.
     Structure: the day's official name and date, a tribute phrase, one accurate customary symbol, the logo small and
     in one quiet colour. No accent colour, no URL, CTA, price, product or hashtag campaign. Centred and calm.
     The symbol: a laurel wreath (drawn from geometry). Swap it for the day's own customary symbol (occasions.md §1.4);
     flags, monuments and sacred text are never generated: build flags from the official spec, trace monuments from a
     licensed photo. -->
<link rel="stylesheet" href="https://codex-design.invalid/kit/cd-kit.css">
<link rel="stylesheet" href="https://codex-design.invalid/sample-brand/brand.css">
<script src="https://codex-design.invalid/kit/cd-kit.js"></script>
<style>
  body { background: var(--paper); color: var(--ink); }
  .safe { display: grid; grid-template-rows: 1fr auto auto auto 1fr auto; justify-items: center; text-align: center; }
  .wreath { grid-row: 2; width: 330px; height: auto; }
  .wreath .stem { fill: none; stroke: var(--muted); stroke-width: 5; stroke-linecap: round; }
  .wreath .leaves { fill: var(--muted); }
  .day { grid-row: 3; margin: 56px 0 0; font: 700 34px/1.2 var(--font-text); color: var(--muted); }
  h1 { grid-row: 4; margin: 26px 0 0; width: 86%; font: 700 104px/1.02 var(--font-display); letter-spacing: -0.02em;
    text-wrap: balance; }
  .wordmark { grid-row: 6; width: max(190px, var(--wordmark-min, 0px)); aspect-ratio: 971 / 162; background: var(--muted);
    -webkit-mask: url(https://codex-design.invalid/sample-brand/wordmark.svg) no-repeat center / contain;
    mask: url(https://codex-design.invalid/sample-brand/wordmark.svg) no-repeat center / contain; }
  [data-preset="ig-square"] .wreath, [data-preset="li-square"] .wreath { width: 260px; }
  [data-preset="ig-square"] h1, [data-preset="li-square"] h1 { font-size: 92px; }
  [data-preset="ig-story"] .wreath, [data-preset="vertical-safe"] .wreath { width: 420px; }
  [data-preset="ig-story"] h1, [data-preset="vertical-safe"] h1 { font-size: 112px; width: 92%; }
</style>
