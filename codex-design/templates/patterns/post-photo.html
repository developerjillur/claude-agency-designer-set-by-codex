<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photo-led post</title>
<!-- Pattern: photo-led post (direction "Photo-led Minimal"). Presets: ig-portrait, ig-3x4, ig-square, fb-feed, ig-story,
     li-square. The photo is the message; type sits in the calm zone with an eased scrim only as strong as the contrast
     check needs. Swap .plate's background for <img class="fill" src="plates/…"> (a 4:5 plate with the bottom third calm;
     a 9:16 plate for stories). Replace the sample-brand link with your project's brand/brand.css. -->
<link rel="stylesheet" href="https://codex-design.invalid/kit/cd-kit.css">
<link rel="stylesheet" href="https://codex-design.invalid/sample-brand/brand.css">
<script src="https://codex-design.invalid/kit/cd-kit.js"></script>
<style>
  :root { --m: calc(var(--canvas-w) * .074); }
  body { background: var(--ink); }
  /* the sample plate: a 4:5 photo with a calm lower third (a 9:16 one on stories) */
  .plate { position: absolute; inset: 0;
    background: #2a241e url(https://codex-design.invalid/patterns/assets/photos/roastery-4x5.webp) center top / auto 110% no-repeat; }
  [data-preset="ig-story"] .plate, [data-preset="vertical-safe"] .plate {
    background-image: url(https://codex-design.invalid/patterns/assets/photos/roastery-9x16.webp); background-position: center 40%; }
  /* eased scrim: dark 0 -> ~62 % over the bottom 55 % (13 stops approximate an ease-in curve) */
  .scrim { position: absolute; inset: 0; background: linear-gradient(to top,
      rgb(14 16 17 / .84) 0%, rgb(14 16 17 / .80) 16%, rgb(14 16 17 / .72) 28%, rgb(14 16 17 / .58) 38%,
      rgb(14 16 17 / .40) 47%, rgb(14 16 17 / .22) 55%, rgb(14 16 17 / .08) 62%, rgb(14 16 17 / 0) 68%),
      linear-gradient(to bottom, rgb(14 16 17 / .42) 0%, rgb(14 16 17 / .22) 8%, rgb(14 16 17 / 0) 16%); }
  .top { position: absolute; top: var(--safe-top); left: var(--safe-left); right: var(--safe-right);
    display: flex; justify-content: space-between; align-items: center; }
  .mark { width: max(calc(var(--canvas-w) * .052), var(--mark-min, 0px)); height: auto; }
  .date { font: 700 max(34px, var(--label-min, 0px))/1 var(--font-text); color: #fff; letter-spacing: .01em; }
  .copy { position: absolute; left: var(--safe-left); right: calc(var(--safe-right) + var(--canvas-w) * .12);
    bottom: var(--safe-bottom); color: #fff; }
  h1 { margin: 0; height: calc(var(--canvas-h) * .25); display: flex; align-items: flex-end;
    font: 800 120px/0.98 var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
  .sub { margin: 28px 0 0; max-width: 30ch; font: 500 40px/1.3 var(--font-text); color: rgb(255 255 255 / .92); text-wrap: pretty; }
  /* the action reads as a line of type with the accent under it; the pill button (class="cta pill") is opt-in: judges
     call a pill on every design a template tell */
  .cta { display: inline-block; margin-top: 40px; padding-bottom: 10px; border-bottom: 5px solid var(--accent);
    color: #fff; font: 700 40px/1 var(--font-text); text-box: trim-both cap alphabetic; }
  .cta.pill { padding: 22px 34px; border: 0; border-radius: 999px; background: var(--accent); color: var(--ink); }
  [data-preset="ig-square"] h1, [data-preset="li-square"] h1 { height: calc(var(--canvas-h) * .22); }
  /* square: the photo covers the frame, and the scrim holds the lower half where the words sit */
  [data-preset="ig-square"] .plate, [data-preset="li-square"] .plate { background-size: cover; background-position: center 64%; }
  [data-preset="ig-square"] .scrim, [data-preset="li-square"] .scrim { background: linear-gradient(to top,
      rgb(14 16 17 / .9) 0%, rgb(14 16 17 / .86) 30%, rgb(14 16 17 / .74) 44%, rgb(14 16 17 / .46) 54%,
      rgb(14 16 17 / .16) 64%, rgb(14 16 17 / 0) 72%),
      linear-gradient(to bottom, rgb(14 16 17 / .5) 0%, rgb(14 16 17 / .2) 12%, rgb(14 16 17 / 0) 20%); }
  [data-preset="ig-story"] .copy, [data-preset="vertical-safe"] .copy { right: var(--safe-right); }
  [data-preset="ig-story"] .scrim, [data-preset="vertical-safe"] .scrim { background: linear-gradient(to top,
      rgb(14 16 17 / .8) 0%, rgb(14 16 17 / .7) 20%, rgb(14 16 17 / .5) 34%, rgb(14 16 17 / .2) 44%, rgb(14 16 17 / 0) 52%),
      linear-gradient(to bottom, rgb(14 16 17 / .66) 0%, rgb(14 16 17 / .5) 14%, rgb(14 16 17 / .16) 22%, rgb(14 16 17 / 0) 28%); }
  [data-preset="ig-story"] h1, [data-preset="vertical-safe"] h1 { height: calc(var(--canvas-h) * .2); }
</style>
</head>
<body>
  <div class="plate"></div>
  <div class="scrim"></div>
  <div class="top">
    <img class="mark" src="https://codex-design.invalid/sample-brand/logo-mark-reversed.svg" alt="">
    <span class="date">Sat 10 Oct</span>
  </div>
  <div class="copy">
    <h1 data-fit="72,124" data-fit-lines="2">Watch us roast this Saturday</h1>
    <p class="sub">The drum starts at 9 at 12 Harbour Street. Stay for a cup.</p>
    <span class="cta">Plan your visit</span>
  </div>
</body>
</html>
