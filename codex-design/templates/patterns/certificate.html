<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Certificate</title>
<!-- Pattern: certificate (direction "Quiet formal"). Presets certificate-a4-landscape (297 x 210 mm) and
     certificate-letter-landscape (11 x 8.5 in), 3 mm bleed.
     Render: design.py render --html certificate.html --preset certificate-a4-landscape --out out/certificate.pdf --preview
     Reading order: who gives it (the logo), what it is, who receives it (the biggest line), what for, then the proof
     (date, signature, certificate number). The frame sits 12 mm inside the trim, because a frame near the edge shows
     every millimetre of trim drift. The name changes on every copy: data-fit keeps a long name on one line; for a
     handwritten name, leave the line empty and print on uncoated stock. The signature is the signer's own scanned
     signature placed above the line (<img class="sig" src="signature.png">); never draw one. For many names, render
     one PDF per name from the same HTML (copy.json per person) or merge the names at the printer. -->
<link rel="stylesheet" href="https://codex-design.invalid/kit/cd-kit.css">
<link rel="stylesheet" href="https://codex-design.invalid/sample-brand/brand.css">
<script src="https://codex-design.invalid/kit/cd-kit.js"></script>
<style>
  body { background: var(--paper); color: var(--print-black); }
  .frame { position: absolute; inset: calc(var(--bleed) + 12mm); border: 1.6mm solid var(--primary); }
  .frame::after { content: ""; position: absolute; inset: 2.2mm; border: 0.35mm solid var(--accent); }
  .content { position: absolute; inset: calc(var(--bleed) + 24mm) calc(var(--bleed) + 30mm) calc(var(--bleed) + 21mm);
    display: grid; grid-template-rows: 1fr auto 1.4fr auto; justify-items: center; text-align: center; }
  .main { grid-row: 2; display: grid; justify-items: center; width: 100%; }
  .mark { height: 15mm; width: auto; }
  .kind { margin: 8mm 0 0; font: 700 13pt/1.2 var(--font-text); letter-spacing: .22em; text-transform: uppercase;
    color: var(--primary); }
  .lead { margin: 7mm 0 0; font: 400 13pt/1.4 var(--font-text); }
  .name { width: 70%; margin: 2mm 0 0; padding-bottom: 2.5mm; border-bottom: 0.35mm solid var(--line);
    font: 800 72px/1.1 var(--font-display); letter-spacing: -0.015em; white-space: nowrap; }
  .what { max-width: 150mm; margin: 6mm 0 0; font: 400 13pt/1.45 var(--font-text); text-wrap: balance; }
  .proof { grid-row: 4; width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10mm; }
  .proof .mid { display: grid; justify-items: center; gap: 2.5mm; }
  .proof .slot { display: grid; justify-items: center; }
  .proof .line { width: 62mm; border-top: 0.35mm solid var(--print-black); padding-top: 2mm; }
  .proof b { font: 700 13pt/1.3 var(--font-text); }
  .proof small { display: block; margin-top: 1mm; font: 500 10pt/1.35 var(--font-text); color: var(--muted); }
  .seal { width: 24mm; height: 24mm; }
  .seal .a { fill: var(--accent); }
  .seal .b { fill: none; stroke: var(--paper); stroke-width: 1.2; stroke-dasharray: 2 2.2; }
  .seal .c { fill: var(--primary); }
  .no { font: 500 10pt/1.35 var(--font-text); color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
  <div class="bleedbox"></div>
  <div class="frame" aria-hidden="true"></div>
  <div class="content">
    <div class="main">
      <img class="mark logo" src="https://codex-design.invalid/sample-brand/logo-mark.svg" alt="Tidewater Coffee Roasters">
      <p class="kind">Certificate of completion</p>
      <p class="lead">This certifies that</p>
      <p class="name" data-fit="48,72" data-fit-lines="1">Maya Chen</p>
      <p class="what">has completed the Home Roasting Course: twelve hours of roasting, cupping and choosing green
        coffee at Tidewater Coffee Roasters.</p>
    </div>
    <div class="proof">
      <div class="slot"><div class="line"><b>12 October 2026</b><small>Date</small></div></div>
      <div class="mid">
        <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="a" cx="50" cy="50" r="48"/><circle class="b" cx="50" cy="50" r="41"/>
          <circle class="c" cx="50" cy="50" r="30"/>
        </svg>
        <div class="no">Certificate no. TW-2026-0147</div>
      </div>
      <div class="slot"><div class="line"><b>Ana Ruiz</b><small>Head roaster</small></div></div>
    </div>
  </div>
</body>
</html>
