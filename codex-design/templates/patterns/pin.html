<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pinterest pin</title>
<!-- Pattern: Pinterest pin (direction "Save-worthy guide"). Presets: pin-standard. A pin is seen as a 236 px wide
     tile in a two-column grid, so every word is at least 47 px on the 1000 px canvas and the headline says what the
     reader gets (a list, a how-to, a result). The paper panel overlaps the photo's bottom edge for depth; the photo
     keeps its subject in the top half. Swap .photo's background for <img class="fill" src="plates/…"> (a 2:3 plate
     with the subject high). No pill button: the pin itself is the link. Replace the sample-brand link with your
     project's brand/brand.css. -->
<link rel="stylesheet" href="https://codex-design.invalid/kit/cd-kit.css">
<link rel="stylesheet" href="https://codex-design.invalid/sample-brand/brand.css">
<script src="https://codex-design.invalid/kit/cd-kit.js"></script>
<style>
  body { background: var(--sand); color: var(--ink); }
  .photo { position: absolute; left: 0; top: 0; width: var(--canvas-w); height: calc(var(--canvas-h) * .56);
    background: #30271f url(https://codex-design.invalid/patterns/assets/photos/cup-2x3.webp) center 30% / cover no-repeat; }
  .photo img.fill { width: 100%; height: 100%; object-fit: cover; }
  .panel { position: absolute; left: calc(var(--safe-left) - 20px); right: calc(var(--safe-right) - 20px);
    top: calc(var(--canvas-h) * .43); bottom: var(--safe-bottom); background: var(--paper);
    border-radius: var(--radius); padding: 44px 40px 40px; display: grid; grid-template-rows: auto auto 1fr auto;
    box-shadow: 0 18px 40px rgb(22 25 27 / .18); }
  .kicker { font: 700 max(48px, var(--label-min, 0px))/1.1 var(--font-text); color: var(--primary); }
  h1 { margin: 22px 0 0; height: 214px; font: 800 96px/1.04 var(--font-display); letter-spacing: -0.02em;
    text-wrap: balance; }
  ol { margin: 28px 0 0; padding: 0; list-style: none; counter-reset: n; align-self: start; }
  li { counter-increment: n; display: grid; grid-template-columns: 64px 1fr; align-items: baseline;
    font: 500 max(48px, var(--label-min, 0px))/1.3 var(--font-text); }
  li::before { content: counter(n); font: 800 68px/1 var(--font-display); color: var(--accent); }
  .foot { display: flex; justify-content: space-between; align-items: center; border-top: 3px solid var(--line);
    padding-top: max(26px, calc(var(--wordmark-min, 0px) * 162 / 971 * .62)); }
  .foot .wm { width: max(300px, var(--wordmark-min, 0px)); height: auto; }
  .foot span { font: 700 max(48px, var(--label-min, 0px))/1 var(--font-text); color: var(--muted); }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="panel">
    <div class="kicker">Brew guide</div>
    <h1 data-fit="80,96" data-fit-lines="2">Five fixes for better coffee at home</h1>
    <ol>
      <li>Grind just before brewing</li>
      <li>Weigh 60 g per litre</li>
      <li>Water at 94 °C</li>
    </ol>
    <div class="foot"><img class="wm wordmark" src="https://codex-design.invalid/sample-brand/wordmark.svg" alt="Tidewater"><span>+2 more</span></div>
  </div>
</body>
</html>
